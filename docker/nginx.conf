server {
    listen 18080;
    server_name _;

    location = / {
        return 302 /beijing/;
    }
    location = /beijing {
        return 308 /beijing/;
    }
    location ^~ /beijing/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $journal_backend journal:3000;
        proxy_pass http://$journal_backend$request_uri;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 12m;
    }
    location / {
        return 404;
    }
}
